name: CI
on:
  release:
    types: [released, prereleased]
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: corretto
          java-version: 17
          cache: 'gradle'

      - name: Compile and test
        run: ./gradlew build --info

      - name: Check coverage
        run: ./gradlew jacocoTestCoverageVerification --info

      - name: Archive code coverage results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: build-reports
          path: '*/build/reports'
          retention-days: 1

  publish:
    name: Publish
    needs: [test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: corretto
          java-version: 17
          cache: 'gradle'

      - name: Gradle publish
        run: ./gradlew publish --info --no-daemon
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  end:
    name: End
    needs: [test, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Build summary
        id: summary
        env:
          TEST: ${{ needs.test.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          echo "success=$(if [[ "$TEST$PUBLISH" =~ ^(success|skipped)+$ ]]; then echo "true"; else echo "false"; fi)" >> $GITHUB_OUTPUT

      - name: Notify slack fail
        if: steps.summary.outputs.success != 'true' && env.SLACK_BOT_TOKEN != 0
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: dev
          payload: |
            {
              "text": "${{github.repository}}: CI failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "emoji": true,
                    "text": ":x: ${{github.repository}}: CI failed"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Repository: <${{github.server_url}}/${{github.repository}}|${{github.repository}}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "Triggered by: *${{github.triggering_actor}}*"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "See failed run: <${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}|${{github.run_id}}>"
                  }
                }
              ]
            }
